<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño Gráfico — Eric Martos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Caveat: la fuente manuscrita usada solo en el "script-note" de esta página -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Color de acento propio de esta página (rojo del logo).
       Se usa en el subrayado del menú activo, el resplandor de fondo,
       los botones de flecha del carrusel, etc. — ver styles.css */
    :root{ --accent2:#E15B4F; }

    .page-hero .script-note{
      font-family:'Caveat', cursive; font-weight:700; font-size:26px; color:var(--coral);
    }
  </style>
</head>
<body>

  <!-- Barra de navegación — idéntica en las 6 páginas, ver comentario en index.html -->
  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-logo-chip"><img src="assets/logo.png" alt="Martos Designs"></span>
      </a>
      <nav class="nav-links">
        <a class="nav-item" href="index.html">Inicio</a>
        <a class="nav-item" href="diseno.html">Diseño</a>
        <a class="nav-item" href="video.html">Vídeo</a>
        <a class="nav-item" href="web.html">Web</a>
        <a class="nav-item" href="sobre-mi.html">Sobre mí</a>
        <a class="nav-item" href="contacto.html">Contacto</a>
      </nav>
      <button class="nav-burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="mobile-panel">
      <a href="index.html">Inicio</a>
      <a href="diseno.html">Diseño</a>
      <a href="video.html">Vídeo</a>
      <a href="web.html">Web</a>
      <a href="sobre-mi.html">Sobre mí</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </header>

  <main>

    <!-- ===========================================================
         CABECERA — título + frase manuscrita + trazo dibujado
         =========================================================== -->
    <div class="page-hero section-dark">
      <div class="ambient-glow" aria-hidden="true"></div>
      <div class="wrap">
        <div class="eyebrow">01 — Diseño Gráfico</div>
        <h1>Diseño Gráfico</h1>
        <span class="script-note">de la idea al detalle</span>
        <p class="sec-desc">Identidad visual, piezas de marca y material para creadores de contenido: logos, overlays de stream y miniaturas.</p>
        <svg class="squiggle draw" width="140" height="14" viewBox="0 0 140 14" style="margin-top:20px;">
          <path d="M2 8 Q 35 2, 70 8 T 138 6"/>
        </svg>
      </div>
    </div>

    <!-- ===========================================================
         PIEZAS DE DISEÑO
         render.js rellena el contenedor #diseno-app con:
           - una fila de pestañas: Todo · Packs · un tipo por categoría
             (Logos, Overlays, Miniaturas... los tipos se gestionan desde
             el panel de administración y solo aparecen si tienen piezas)
           - la rejilla de tarjetas de la pestaña activa
         Se puede enlazar a una pestaña concreta: diseno.html#logo
         Al pulsar una pieza se abre el visor ampliado (lightbox); si
         pertenece a un pack, el visor recorre todo el pack.
         =========================================================== -->
    <section class="section-light">
      <div class="wrap">
        <div id="diseno-app"></div>
      </div>
    </section>

  </main>

  <footer>© 2026 Eric Martos — martos.designs</footer>

  <!-- Contenido dinámico: SDK de Firebase → configuración → datos → pintado.
       Después, script.js activa el comportamiento (animaciones, visor...). -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
</body>
</html>
