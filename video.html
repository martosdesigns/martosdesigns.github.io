<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo — Eric Martos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Color de acento propio de esta página: ámbar, en referencia
       al visor de exposición de una cámara/moviola */
    :root{ --accent2:#E3B15B; }
  </style>
</head>
<body>

  <!-- Barra de navegación — idéntica en las 6 páginas, ver comentario en index.html -->
  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="nav-logo-chip"><img src="assets/logo.png" alt="Martos Designs"></span>
      </a>
      <nav class="nav-links">
        <a class="nav-item" href="index.html">Inicio</a>
        <a class="nav-item" href="diseno.html">Diseño</a>
        <a class="nav-item" href="video.html">Vídeo</a>
        <a class="nav-item" href="web.html">Web</a>
        <a class="nav-item" href="sobre-mi.html">Sobre mí</a>
        <a class="nav-item" href="contacto.html">Contacto</a>
      </nav>
      <button class="nav-burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="mobile-panel">
      <a href="index.html">Inicio</a>
      <a href="diseno.html">Diseño</a>
      <a href="video.html">Vídeo</a>
      <a href="web.html">Web</a>
      <a href="sobre-mi.html">Sobre mí</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </header>

  <main>

    <!-- ===========================================================
         CABECERA
         =========================================================== -->
    <div class="page-hero section-dark">
      <div class="ambient-glow" aria-hidden="true"></div>
      <div class="wrap">
        <div class="eyebrow">02 — Vídeo</div>
        <h1>Edición de Vídeo</h1>
        <p class="sec-desc">Montaje, motion graphics y corrección de color.</p>
      </div>
    </div>

    <!-- ===========================================================
         PROYECTOS
         La tira de timecodes (.tc-strip) es solo decorativa, un guiño
         a la identidad de editor de vídeo — no representa nada real.

         Las tarjetas las pinta render.js con los vídeos que das de alta
         en el panel de administración (sección Vídeo): cada una enlaza
         a su vídeo de YouTube y usa tu miniatura como portada.
         =========================================================== -->
    <section class="section-light">
      <div class="wrap">

        <div class="tc-strip">
          <span>00:00</span><span>00:15</span><span>00:30</span><span>00:45</span><span>01:00</span><span>01:15</span>
        </div>

        <div class="subgroup-label" style="margin-top:0;">
          <span>Proyectos</span>
          <span class="sg-line"></span>
          <div class="car-controls">
            <button class="car-btn" data-target="car-clips" data-dir="-1" aria-label="Anterior">‹</button>
            <button class="car-btn" data-target="car-clips" data-dir="1" aria-label="Siguiente">›</button>
          </div>
        </div>

        <div class="carousel" id="car-clips" data-render="video"></div>
      </div>
    </section>

  </main>

  <footer>© 2026 Eric Martos — martos.designs</footer>

  <!-- Contenido dinámico: SDK de Firebase → configuración → datos → pintado.
       Después, script.js activa el comportamiento (carruseles, animaciones...). -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
</body>
</html>
